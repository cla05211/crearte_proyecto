<div class="shell-container">
  <header class="navbar">
    <a class="navbar__brand" routerLink="/portal-cliente" aria-label="Ir al inicio">
      <img src="/crearte-wordmark.png" alt="Crearte" />
    </a>

    <div class="navbar__actions">

      <button class="icon-button" type="button" (click)="cerrarSesion()" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M21 19V5a2 2 0 0 0-2-2h-6" />
        </svg>
      </button>

      <button
        class="icon-button"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="sidebarAbierto()"
        aria-controls="main-navigation"
        [attr.aria-label]="sidebarAbierto() ? 'Cerrar menú' : 'Abrir menú'">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>
  </header>

  @if (sidebarAbierto()) {
    <button class="sidebar-backdrop" type="button" (click)="cerrarSidebar()" aria-label="Cerrar menú"></button>
  }

  <aside id="main-navigation" class="sidebar" [class.abierto]="sidebarAbierto()" aria-label="Navegación principal">
    <div class="sidebar__header">
      <span>Menú</span>
      <button class="icon-button icon-button--close" type="button" (click)="cerrarSidebar()" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
    </div>
    <nav>
      <a routerLink="/portal-cliente" routerLinkActive="activo" (click)="cerrarSidebar()">Inicio</a>
      <a routerLink="/cuenta-corriente" routerLinkActive="activo" (click)="cerrarSidebar()">Cuenta corriente</a>
    </nav>
  </aside>

  <main class="contenido">
    <router-outlet></router-outlet>
  </main>
</div>
