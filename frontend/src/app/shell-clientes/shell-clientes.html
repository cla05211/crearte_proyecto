<div class="shell-container">
  <header class="navbar">
    <a class="navbar__brand" routerLink="/portal-cliente" aria-label="Ir al inicio">
      <img src="/crearte-wordmark.png" alt="Crearte" />
    </a>

    <div class="navbar__actions">
      @if (colegio) {
        <div class="navbar-cliente">
          <span class="navbar-cliente__colegio">{{ colegio }}</span>
          @if (usuario) {
            <span class="navbar-cliente__usuario">{{ usuario }}</span>
          }
        </div>
      }

      @if (!enInicio()) {
        <a class="text-button" routerLink="/portal-cliente">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
          Inicio
        </a>
      }

      <button class="icon-button" type="button" (click)="cerrarSesion()" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M21 19V5a2 2 0 0 0-2-2h-6" />
        </svg>
      </button>
    </div>
  </header>

  <main class="contenido">
    <router-outlet></router-outlet>
  </main>
</div>
