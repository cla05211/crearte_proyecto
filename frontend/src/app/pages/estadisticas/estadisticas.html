<main class="estadisticas-page">
  <section class="ds-container estadisticas-container">
    <header class="estadisticas-header">
      <div>
        <span class="ds-eyebrow">Administración</span>
        <h1 class="ds-heading-1">Estadísticas</h1>
      </div>
      <label class="ds-field estadisticas-anio">
        <span class="ds-label">Año</span>
        <select class="ds-select" [ngModel]="anioEstadisticas.anio()" (ngModelChange)="anioEstadisticas.anio.set($event)">
          @for (anio of anioEstadisticas.aniosDisponibles; track anio) {
            <option [ngValue]="anio">{{ anio }}</option>
          }
        </select>
      </label>
    </header>

    <!-- Para sumar una ventana nueva: agregar el link acá y la ruta hija en app.routes.ts -->
    <nav class="estadisticas-tabs" aria-label="Secciones de estadísticas">
      <a routerLink="ventas" routerLinkActive="is-active">Ventas</a>
      <a routerLink="produccion" routerLinkActive="is-active">Producción</a>
      <a routerLink="bancos" routerLinkActive="is-active">Bancos</a>
      <a routerLink="cobranzas" routerLinkActive="is-active">Cuentas corrientes</a>
    </nav>

    <section class="estadisticas-content">
      <router-outlet></router-outlet>
    </section>
  </section>
</main>
