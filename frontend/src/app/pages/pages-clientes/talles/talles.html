<main class="colegio-page">
  <div class="colegio-page__shape colegio-page__shape--left" aria-hidden="true"></div>
  <div class="colegio-page__shape colegio-page__shape--right" aria-hidden="true"></div>

  <section class="ds-container colegio-container">

    <header class="colegio-header">
      <h1 class="ds-heading-1">Talles</h1>
    </header>

    @if (confirmacion.confirmados() === null) {
      <p class="ds-text-muted talles-cargando" role="status" aria-live="polite">Cargando...</p>
    } @else if (confirmacion.confirmados()) {
      <section class="colegio-content">
        <app-resumen-firmado />
      </section>
    } @else {
      <nav class="colegio-tabs" aria-label="Secciones del colegio">
          @if (!muestrasFisicas()) {
            <a routerLink="tutorial" routerLinkActive="is-active">¿Cómo tomar las medidas?</a>
          }
          <a routerLink="carga" routerLinkActive="is-active">Cargar talles</a>
      </nav>

      <section class="colegio-content">
        <router-outlet></router-outlet>
      </section>
    }
  </section>
</main>
